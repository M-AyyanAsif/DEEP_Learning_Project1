<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>kidney tumor predicitor</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        body{
            background-color: #eff2f9;
        }
        .iupload h3{
            color: #000000;
            font-size: 30px;
            font-weight: 700;
            border: 1px solid #000000;
            display: inline-block;
            padding: 20px 40px;
            margin-bottom: 20px;
        }
        .header-container {
            text-align: center;
            width: 100%;
        }
        .img-part{
            height:300px;
            width:300px;
            margin:0px auto;
        }
        .image-part{
            height:300px;
            width:300px;
            border:1px solid #1b2d6b;
        }
        .image-part img{
            position:absolute;
            height: 300px;
            width:300px;
            display:none;
            padding:5px;
        }
        .image-part #video{
            display:block;
            height: 300px;
            width:300px;
            padding:5px;
        }
        .res-part{
            border:none;
            height: 100%;
            width:100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow:auto;
        }
        .resp-img{
            height: 298px;
            width: 233px;
            margin:0px auto;
        }
        #send{
            cursor:pointer;
        }
        .btn-part{
            width:325px;
        }
        textarea,
        select,
        .form-control,
        .custom-select,
        button.btn,
        .btn-primary,
        input[type="text"],
        input[type="url"],
        .uneditable-input{
            border: 1px solid #363e75;
            outline: 0 !important;
            border-radius:0px;
            box-shadow: none;
        }
        #loading {
            position: fixed;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100%;
            z-index: 9999999999;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.7);
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #363e75;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            left: 50%;
            margin-left: -4em;
            display: block;
            animation: spin 2s linear infinite;
        }
        .loader,
        .loader:after {
            display: block;
            position: absolute;
            top: 50%;
            margin-top: -4.05em;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .right-part{
            border: 1px solid #000000;
            padding:0; /* Removed padding to keep size exact */
            display: flex;
            flex-direction: column;
            height: 300px; /* Equal to image-part height */
            width: 300px;  /* Equal to image-part width */
            margin: 0 auto;
        }
        .result-title {
            padding: 10px 0;
            border-bottom: 1px solid #000;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
<div class="main container">
    <section class="iupload">
        <div class="header-container py-4">
            <h3>Kidney Tumor Disease Classification</h3>
        </div>
        <div class="row">
            <div class="img-part col-md-6 mb-3">
                <div class="image-part">
                    <video autoplay id="video"></video>
                    <img src="" id="photo">
                    <canvas style="display:none;" id="canvas"></canvas>
                </div>
                <div class="btn-part">
                    <form id="upload-data" class="">
                        <div class="input-group mt-3 row">
                            <button type="button"
                                    class="btn btn-primary col-md-5 col-xs-5 ml-3 mr-4"
                                    id="uload">
                                Upload
                            </button>
                            <button id="send"
                                    type="button"
                                    class="btn btn-success col-md-5 col-xs-5">
                                Predict
                            </button>
                        </div>
                        <input type="hidden"
                               class="form-control mr-2"
                               id="url"
                               value="../predict"/>
                        <input name="upload"
                               type="file"
                               id="fileinput"
                               style="position:absolute;top:-500px;"/>
                    </form>
                </div>
            </div>
            <div class="col-md-6 col-xs-12">
                <div class="right-part">
                    <div class="result-title">
                        <h5 class="mb-0 text-center">The Prediction Result shows</h5>
                    </div>
                    <div class="res-part">
                        <!-- Result content will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div id="loading">
    <div class="loader"></div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script>
var myphoto = document.getElementById('photo');
var base_data = "";
function sendRequest(base64Data){
    if(base64Data != "" && base64Data != null){
        var url = $("#url").val();
        $("#loading").show();
        $.ajax({
            url : url,
            type: "post",
            cache: false,
            async: true,
            crossDomain: true,
            headers: {
                'Content-Type': 'application/json'
            },
            data: JSON.stringify({
                image: base64Data
            }),
            success: function(res){
                var resultText = res[0].image;
                // Logic for Tumor vs Normal display
                var displayMsg = (resultText.toLowerCase() === "tumor") ? "Image is Tumor" : "Image is Normal";
                
                $(".res-part").html(
                    "<h3 style='color:#1b2d6b; text-align:center; padding: 10px;'>" +
                    displayMsg +
                    "</h3>"
                );
                $("#loading").hide();
            },
            error: function(){
                $("#loading").hide();
                $(".res-part").html(
                    "<h3 style='color:red; text-align:center; padding: 10px;'>" +
                    "Prediction Failed" +
                    "</h3>"
                );
            }
        });
    }
}

$(document).ready(function(){
    $("#loading").hide();
    $('#send').click(function(){
        sendRequest(base_data);
    });
    $('#uload').click(function() {
        $('#fileinput').focus().trigger('click');
    });
    $("#fileinput").change(function(){
        if (this.files && this.files[0]){
            var reader = new FileReader();
            reader.onload = function (e){
                var url = e.target.result;
                var img = new Image();
                img.onload = function(){
                    var canvas = document.createElement('CANVAS');
                    var ctx = canvas.getContext('2d');
                    canvas.height = this.height;
                    canvas.width = this.width;
                    ctx.drawImage(this, 0, 0);
                    base_data = canvas
                        .toDataURL('image/jpeg', 1.0)
                        .replace(/^data:image.+;base64,/, '');

                    canvas = null;
                };
                img.src = url;
                $('#photo').attr('src', url);
                $('#photo').show();
                $('#video').hide();
            }
            reader.readAsDataURL(this.files[0]);
        }
    });
});
</script>
</body>
</html>
